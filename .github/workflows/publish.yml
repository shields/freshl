name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install gitcalver --locked
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    needs: verify
  verify:
    name: Verify release
    # GitHub self-repository references resolve CI at this commit without checkout.
    # https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
    uses: ./.github/workflows/ci.yaml # zizmor: ignore[self-repository] Reusable CI resolves to the caller's commit.
